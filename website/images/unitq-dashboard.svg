<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="uArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="640" fill="#fafafa"/>
  <rect x="0.75" y="0.75" width="1118.5" height="638.5" rx="14" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- header -->
  <rect x="26" y="26" width="7" height="34" rx="3.5" fill="#6366f1"/>
  <text x="45" y="43" font-size="21" font-weight="700" fill="#171717">UnitQ · Voice of Customer</text>
  <text x="45" y="64" font-size="12.5" fill="#737373">PayPal Everywhere — US + Germany · last 30 days</text>
  <text x="1094" y="43" font-size="12" fill="#a3a3a3" text-anchor="end" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.5">LIVE</text>

  <!-- KPI tiles -->
  <g>
    <rect x="26" y="90" width="256" height="88" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="44" y="116" font-size="12" fill="#737373">Total mentions</text>
    <text x="44" y="150" font-size="26" font-weight="700" fill="#171717">2,300</text>
    <text x="204" y="150" font-size="12" fill="#10b981">↑ 18%</text>
    <text x="44" y="168" font-size="11" fill="#a3a3a3">reviews · social · tickets</text>
  </g>
  <g>
    <rect x="298" y="90" width="256" height="88" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="316" y="116" font-size="12" fill="#737373">Net sentiment</text>
    <text x="316" y="150" font-size="26" font-weight="700" fill="#171717">+0.4</text>
    <text x="438" y="150" font-size="12" fill="#10b981">↑</text>
    <text x="316" y="168" font-size="11" fill="#a3a3a3">vs prior 30 days</text>
  </g>
  <g>
    <rect x="570" y="90" width="256" height="88" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="588" y="116" font-size="12" fill="#737373">Top theme</text>
    <text x="588" y="150" font-size="21" font-weight="700" fill="#171717">Accidental transfers</text>
    <text x="588" y="168" font-size="11" fill="#a3a3a3">23% of complaints</text>
  </g>
  <g>
    <rect x="842" y="90" width="252" height="88" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="860" y="116" font-size="12" fill="#737373">Issue-detection time</text>
    <text x="860" y="150" font-size="26" font-weight="700" fill="#171717">5 days</text>
    <text x="1012" y="150" font-size="12" fill="#10b981">↓ from 3 wks</text>
    <text x="860" y="168" font-size="11" fill="#a3a3a3">signal → roadmap</text>
  </g>

  <!-- left: bar chart -->
  <text x="26" y="224" font-size="14" font-weight="600" fill="#171717">Complaint volume by theme</text>
  <text x="26" y="242" font-size="11.5" fill="#a3a3a3">unsolicited mentions, segmented by theme</text>

  <g font-size="13" fill="#525252">
    <text x="26" y="282">Accidental transfers</text>
    <rect x="190" y="268" width="380" height="20" rx="6" fill="#eef0f4"/>
    <rect x="190" y="268" width="380" height="20" rx="6" fill="#ef4444"/>
    <text x="580" y="284" font-family="ui-monospace, monospace" fill="#171717">320</text>

    <text x="26" y="336">Notification timing</text>
    <rect x="190" y="322" width="380" height="20" rx="6" fill="#eef0f4"/>
    <rect x="190" y="322" width="285" height="20" rx="6" fill="#f59e0b"/>
    <text x="580" y="338" font-family="ui-monospace, monospace" fill="#171717">240</text>

    <text x="26" y="390">NFC onboarding</text>
    <rect x="190" y="376" width="380" height="20" rx="6" fill="#eef0f4"/>
    <rect x="190" y="376" width="226" height="20" rx="6" fill="#6366f1"/>
    <text x="580" y="392" font-family="ui-monospace, monospace" fill="#171717">190</text>

    <text x="26" y="444">Login friction</text>
    <rect x="190" y="430" width="380" height="20" rx="6" fill="#eef0f4"/>
    <rect x="190" y="430" width="154" height="20" rx="6" fill="#0891b2"/>
    <text x="580" y="446" font-family="ui-monospace, monospace" fill="#171717">130</text>
  </g>

  <!-- right: sentiment trend -->
  <text x="620" y="224" font-size="14" font-weight="600" fill="#171717">Sentiment over 30 days</text>
  <text x="620" y="242" font-size="11.5" fill="#a3a3a3">reviews + social, net sentiment score</text>

  <rect x="620" y="260" width="474" height="220" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="640" y1="300" x2="1074" y2="300"/>
    <line x1="640" y1="350" x2="1074" y2="350"/>
    <line x1="640" y1="400" x2="1074" y2="400"/>
    <line x1="640" y1="450" x2="1074" y2="450"/>
  </g>
  <path d="M640,430 L700,410 L760,418 L820,392 L880,368 L940,352 L1000,330 L1074,300 L1074,460 L640,460 Z" fill="url(#uArea)"/>
  <polyline points="640,430 700,410 760,418 820,392 880,368 940,352 1000,330 1074,300" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1074" cy="300" r="4" fill="#6366f1"/>

  <circle cx="620" cy="500" r="4" fill="#6366f1"/>
  <text x="630" y="504" font-size="11.5" fill="#a3a3a3">Net sentiment score (0 = neutral)</text>

  <line x1="26" y1="580" x2="1094" y2="580" stroke="#e5e5e5"/>
  <text x="26" y="606" font-size="11.5" fill="#a3a3a3">Sources: App Store · Google Play · social (X) · support tickets · in-app feedback — themes auto-tagged by UnitQ</text>
</svg>
