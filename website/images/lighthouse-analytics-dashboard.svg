<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="lArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="640" fill="#fafafa"/>
  <rect x="0.75" y="0.75" width="1118.5" height="638.5" rx="14" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- header -->
  <rect x="26" y="26" width="7" height="34" rx="3.5" fill="#0891b2"/>
  <text x="45" y="43" font-size="21" font-weight="700" fill="#171717">Lighthouse Analytics · Product Analytics</text>
  <text x="45" y="64" font-size="12.5" fill="#737373">Send / Request flow — US + Germany · 18-week launch window</text>
  <text x="1094" y="43" font-size="12" fill="#a3a3a3" text-anchor="end" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.5">WEEKLY</text>

  <!-- KPI tiles -->
  <g>
    <rect x="26" y="90" width="256" height="88" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="44" y="116" font-size="12" fill="#737373">Send / Request completion</text>
    <text x="44" y="150" font-size="26" font-weight="700" fill="#171717">82%</text>
    <text x="162" y="150" font-size="12" fill="#10b981">↑ 9 pts</text>
    <text x="44" y="168" font-size="11" fill="#a3a3a3">task success, send &amp; request</text>
  </g>
  <g>
    <rect x="298" y="90" width="256" height="88" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="316" y="116" font-size="12" fill="#737373">Drop-off</text>
    <text x="316" y="150" font-size="26" font-weight="700" fill="#171717">18%</text>
    <text x="414" y="150" font-size="12" fill="#10b981">↓ 7 pts</text>
    <text x="316" y="168" font-size="11" fill="#a3a3a3">started → completed</text>
  </g>
  <g>
    <rect x="570" y="90" width="256" height="88" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="588" y="116" font-size="12" fill="#737373">Debit Card adoption</text>
    <text x="588" y="150" font-size="26" font-weight="700" fill="#171717">+12%</text>
    <text x="722" y="150" font-size="12" fill="#10b981">↑</text>
    <text x="588" y="168" font-size="11" fill="#a3a3a3">new activations</text>
  </g>
  <g>
    <rect x="842" y="90" width="252" height="88" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="860" y="116" font-size="12" fill="#737373">NFC adoption (DE)</text>
    <text x="860" y="150" font-size="26" font-weight="700" fill="#171717">+9%</text>
    <text x="972" y="150" font-size="12" fill="#10b981">↑</text>
    <text x="860" y="168" font-size="11" fill="#a3a3a3">post onboarding fix</text>
  </g>

  <!-- left: funnel -->
  <text x="26" y="224" font-size="14" font-weight="600" fill="#171717">Send / Request funnel</text>
  <text x="26" y="242" font-size="11.5" fill="#a3a3a3">weekly average, % of users who started</text>

  <g font-size="13" fill="#525252">
    <text x="26" y="282">Started</text>
    <rect x="130" y="268" width="220" height="20" rx="6" fill="#0891b2"/>
    <text x="360" y="284" font-family="ui-monospace, monospace" fill="#171717">100%</text>

    <text x="26" y="336">Confirm &amp; review</text>
    <rect x="130" y="322" width="196" height="20" rx="6" fill="#0891b2" opacity="0.8"/>
    <text x="360" y="338" font-family="ui-monospace, monospace" fill="#171717">89%</text>

    <text x="26" y="390">Recipient &amp; amount</text>
    <rect x="130" y="376" width="180" height="20" rx="6" fill="#0891b2" opacity="0.65"/>
    <text x="360" y="392" font-family="ui-monospace, monospace" fill="#171717">84%</text>

    <text x="26" y="444">Completed</text>
    <rect x="130" y="430" width="176" height="20" rx="6" fill="#0891b2" opacity="0.5"/>
    <text x="360" y="446" font-family="ui-monospace, monospace" fill="#171717">82%</text>
  </g>

  <!-- drop-off callout -->
  <rect x="130" y="470" width="250" height="40" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="142" y="487" font-size="11.5" fill="#b91c1c">Biggest drop-off: recipient confirmation</text>
  <text x="142" y="502" font-size="11" fill="#a3a3a3">fixed → completion ↑</text>

  <!-- right: adoption trend -->
  <text x="620" y="224" font-size="14" font-weight="600" fill="#171717">Task success, weekly</text>
  <text x="620" y="242" font-size="11.5" fill="#a3a3a3">% completion of send / request, launch window</text>

  <rect x="620" y="260" width="474" height="220" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="640" y1="300" x2="1074" y2="300"/>
    <line x1="640" y1="350" x2="1074" y2="350"/>
    <line x1="640" y1="400" x2="1074" y2="400"/>
    <line x1="640" y1="450" x2="1074" y2="450"/>
  </g>
  <path d="M640,410 L700,398 L760,384 L820,368 L880,350 L940,336 L1000,324 L1074,308 L1074,460 L640,460 Z" fill="url(#lArea)"/>
  <polyline points="640,410 700,398 760,384 820,368 880,350 940,336 1000,324 1074,308" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1074" cy="308" r="4" fill="#0891b2"/>

  <circle cx="620" cy="500" r="4" fill="#0891b2"/>
  <text x="630" y="504" font-size="11.5" fill="#a3a3a3">Completion % — anomaly markers reviewed weekly</text>

  <line x1="26" y1="580" x2="1094" y2="580" stroke="#e5e5e5"/>
  <text x="26" y="606" font-size="11.5" fill="#a3a3a3">Events: send / request flow · Debit Card &amp; NFC activation — monitored alongside survey + VoC signals</text>
</svg>
